name: Copia video nello storico

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: copiavideo
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  copia:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installa
        run: pip install telethon

      - name: Copia un blocco
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          SORGENTE: "-1003933737714"
          DESTINAZIONE: "-1004325315199"
          QUANTI: "250"
          PAUSA: "2.5"
        run: python copiautente.py

      - name: Salva lo stato
        if: always()
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add copia-stato.json
          git diff --staged --quiet || git commit -m "avanzamento copia"
          for tentativo in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; git checkout -- .; git reset --hard origin/main; }
            git push && break
            sleep 5
          done

      - name: Prossimo blocco
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 30
          curl -s -o /dev/null -w 'next=%{http_code}\n' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"ref":"main"}' \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/copia.yml/dispatches" || true
