name: Link in bio

on:
  workflow_dispatch:

concurrency:
  group: linkbio
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  invia:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installa
        run: pip install telethon

      - name: Manda il messaggio ogni mezz'ora
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          CHAT: "-1002452050962"
          TESTO: "🔗 Link in bio"
          OGNI: "1800"
          DURATA: "20700"
        run: python linkbio.py

      - name: Prossimo giro
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 10
          curl -s -o /dev/null -w 'next=%{http_code}\n' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"ref":"main"}' \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/linkbio.yml/dispatches" || true
